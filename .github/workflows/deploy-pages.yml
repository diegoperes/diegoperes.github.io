name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site with repository variables
        env:
          EMAIL: ${{ vars.EMAIL || secrets.EMAIL }}
          USER_GITHUB: ${{ vars.USER_GITHUB || secrets.USER_GITHUB }}
          USER_LINKEDIN: ${{ vars.USER_LINKEDIN || secrets.USER_LINKEDIN }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID || secrets.GA_MEASUREMENT_ID }}
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          required = ("EMAIL", "USER_GITHUB", "USER_LINKEDIN")
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              missing_values = ", ".join(missing)
              raise SystemExit(
                  f"Missing GitHub Actions variables or secrets: {missing_values}"
              )

          email = os.environ["EMAIL"].strip()
          user_github = os.environ["USER_GITHUB"].strip().strip("/")
          user_linkedin = os.environ["USER_LINKEDIN"].strip().strip("/")
          ga_measurement_id = os.environ.get("GA_MEASUREMENT_ID", "").strip()

          config_path = Path("js/site-config.js")
          config_path.write_text(
              "\n".join(
                  [
                      "window.SITE_CONFIG = {",
                      f'  linkedin: "https://www.linkedin.com/in/{user_linkedin}/",',
                      f'  github: "https://github.com/{user_github}",',
                      f'  email: "{email}",',
                      f'  analyticsMeasurementId: "{ga_measurement_id}",',
                      "};",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
